# CI: every push and pull request. The tests on Linux (built against
# glibc, whose debug build traps on undefined behaviour in the runtime),
# Windows and macOS; the audit rule (no unsafe blocks, no mutable globals,
# no function with the ffi effect); gen.py's check that the tables and
# vectors are what their definitions and the standards say; and the TLS
# client against OpenSSL's TLS 1.3 server, in each way a server may differ.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXIUM_VERSION: v1.4.0
  NX_NO_UPDATE_CHECK: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Londopy/nexium/.github/actions/setup-nexium@664f8ed46bd4c6b05c15cd665cedad51f9c60c34 # v1.4.0
        with:
          version: ${{ env.NEXIUM_VERSION }}

      - name: Tests
        shell: bash
        run: |
          nx test src/hkdf.nx
          nx test src/ed25519.nx
          nx test src/sha1.nx
          nx test src/x25519.nx
          nx test src/chacha20poly1305.nx
          nx test src/ecdsa.nx
          nx test src/rsa.nx
          nx test src/pem.nx
          nx test src/x509.nx
          nx test src/entropy.nx
          nx test src/tls.nx

      - name: No unsafe blocks, no mutable globals, no ffi
        if: runner.os == 'Linux'
        run: |
          for m in sha2 sha1 hmac hkdf f25519 ed25519 x25519 chacha20poly1305 bn der ecdsa rsa pem x509 entropy tls ct; do
            nx audit src/$m.nx | tee audit.txt
            grep -q "unsafe blocks: 0" audit.txt
            grep -q "mutable globals: 0" audit.txt
            # the module's own functions (at src/...) must not carry ffi
            nx effects src/$m.nx | awk '/^ *at src\// && prev ~ / ffi( |$)/ { bad = 1; print prev } { prev = $0 } END { exit bad }'
          done

  vectors:
    name: Tables and vectors are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: gen.py --check
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python tools/gen.py --check

  interop:
    name: Against OpenSSL's TLS 1.3 server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Londopy/nexium/.github/actions/setup-nexium@664f8ed46bd4c6b05c15cd665cedad51f9c60c34 # v1.4.0
        with:
          version: ${{ env.NEXIUM_VERSION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: tools/interop/run.sh
        run: |
          python -m pip install --disable-pip-version-check cryptography
          bash tools/interop/run.sh
